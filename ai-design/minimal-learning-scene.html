    function gapLayout(width) {

    function drawGapRows(parameter,width,progress,before) {

    function drawReductionAverage(width,progress) {
      const join=clamp(progress,0,1),split=clamp(progress-1,0,1);
      const rows=gapResults(22,21),total=rows.reduce((sum,row)=>sum+row.reduction,0),mean=total/rows.length;
      const unit=Math.min(50,(width-64)/(total+2)),left=(width-total*unit)/2,y=145;
      const layout=gapLayout(width);

        drawGapRows(22,width,1,21);

        svg.querySelectorAll('[data-ma-removed-time]').forEach(node=>node.setAttribute('opacity','0'));
      } else svg.replaceChildren();
      svg.setAttribute('viewBox','0 0 '+width+' 310');svg.style.height='310px';
      svg.setAttribute('data-ma-chart-kind','reduction-average');
      svg.setAttribute('data-ma-direction-parameter','22');
      svg.setAttribute('data-ma-average-progress',String(progress));
      svg.setAttribute('data-ma-total-reduction',String(total));
      svg.setAttribute('data-ma-mean-reduction',String(mean));
      const title=el('title',{id:join<1?'ma-average-description':'ma-stage-title'});
      title.textContent='参数由21增加到22时，三条差距分别减少'+rows.map(row=>number(row.reduction)).join('、')+'厘米；合计减少'+number(total)+'厘米，除以'+rows.length+'后，平均差距减少'+number(mean)+'厘米。当前参数仍是22。这是对减少量的拼合与均分，没有改变预测。';
      if(join<1)svg.children[0].textContent=title.textContent;
      let prefix=0;
      rows.forEach((row,index)=>{
        const sourceX=layout.left+row.value*layout.scale+7,sourceY=layout.rowY(index);
        // The joined total stays constant while the cuts move to equal thirds.
        // These are portions of the total reduction, not individual prediction errors.
        const portion=row.reduction+(mean-row.reduction)*split;
        const targetX=left+prefix*unit;
        const x=sourceX+(targetX-sourceX)*join,cy=sourceY+(y-sourceY)*join;
        const length=row.reduction*layout.scale*(1-join)+portion*unit*join;
        line(x,cy,x+length,cy,{stroke:accent,'stroke-width':8,'stroke-opacity':0.7,
          'data-ma-reduction-piece':row.seconds,'data-ma-origin-reduction':row.reduction,'data-ma-piece-value':portion});
        text(number(portion),x+length/2,cy-25,{
          fill:accent,'text-anchor':'middle',opacity:join,
          'data-ma-average-share':index,'data-ma-share-value':portion
        });
        prefix+=portion;
        if(index<rows.length-1)line(x+length,cy-10,x+length,cy+10,{
          stroke:ink,opacity:join,'data-ma-average-boundary':index
        });
      });
      const summary=split>0
        ? number(total)+' ÷ '+rows.length+' = '+number(mean)+' 厘米'
        : rows.map(row=>number(row.reduction)).join(' + ')+' = '+number(total)+' 厘米';
      text(summary,width/2,y+65,{fill:ink,'text-anchor':'middle',opacity:join,'font-size':14});
    }

    function forwardBend() {

      if(current()==='bend-gate'&&!bend.clipped){bend.clipped=true;refreshBend();return;}
      if(current()==='bend-result'&&!bend.stacked){bend.stacked=true;refreshBend();return;}
      if(current()==='bend-neuron'&&bend.neuronStage<2) {
        const changed=bend.neuronStage===0?bend.weightChanged:bend.biasChanged;if(!changed)return;

    function backwardBend() {
      stopAutomation();
      if(current()==='bend-repair'&&bend.added){bend.added=false;refreshBend();return;}
      if(current()==='bend-gate'&&bend.clipped){bend.clipped=false;refreshBend();return;}
      if(current()==='bend-result'&&bend.stacked){bend.stacked=false;refreshBend();return;}
      if(current()==='bend-neuron') {
        if(bend.parameterPreview){bend.parameterPreview=false;refreshBend();return;}
        if(bend.neuronStage===2){bend.neuronStage=1;bend.parameterPreview=true;refreshBend();return;}
        if(bend.neuronStage===1&&bend.biasChanged){bend.biasChanged=false;refreshBend();return;}
        if(bend.neuronStage===1){bend.neuronStage=0;bend.parameterPreview=true;refreshBend();return;}
        if(bend.weightChanged){bend.weightChanged=false;refreshBend();return;}
      }
      state.scene--;renderScene();

        return {...calculation,actual:row.position,error:calculation.prediction-row.position};
      });
      return {rows,loss:rows.reduce((sum,row)=>sum+row.error*row.error,0)/rows.length,
        gradient:rows.reduce((sum,row)=>sum+2*row.error*row.activated,0)/rows.length};
    }
    function outputStep(output,rate=outputLearningRate,data=shapeRecords,params=bendConfig) {
      return output-rate*outputEvaluate(output,data,params).gradient;

      }
      if(current()==='relay-result') {
        paragraph('把刚才的变化重放到完整预测中。深色窄带是新增贡献：第3秒的0.1经过输出权重20放大，成为预测增加的2，140变成142。');
        relayEquation();paragraph('前两秒的预测仍为70、100。偏置的影响先经过ReLU，再乘20，最后加回原函数；第3秒的局部影响因此是1 × 20 = 20。下方仍放大同一个差距。');return;
      }
      if(current()==='relay-ending') {
        paragraph('我们把几段局部影响接起来：偏置影响激活输出，激活输出影响预测，预测再影响评分。沿途的影响相乘，就是链式法则在这里的作用。');
        paragraph('电脑现在可以学习分支的启动位置。刚才只训练一个偏置，内部权重仍固定；以后再把同样的追踪方式扩展到更多参数和多层计算。');return;
      }
      const result=relayEvaluate(relayBias()),status=relayStatus(),row=result.rows[2];
      paragraph(status==='done'?'平均平方误差已小于0.001，停止调整。偏置接近−2，启动位置接近第2秒，但没有被强行设成答案。':status==='corner'?'有输入恰好落在ReLU拐点，这里的局部斜率不唯一。本演示暂停，不把它冒充为0或1。':status==='flat'?'当前输入的激活都没有传递调整方向，导数为0，但误差仍在。局部梯度无法继续改善，因此暂停。':status==='limit'?'已达到100次调整上限。保留实际参数与评分，可以逐次回退。':relayLesson.cursor===0?'沿用−2.4。第3秒的局部影响20要再乘平方评分的影响，并对三条取平均。因影响被放大，学习率改用较小的0.00125。':'偏置变化先经过激活，再被20倍放大。这次用较小的学习率0.00125控制步幅，每次根据当前预测重算导数。');
      const p=relayEquation();p.appendChild(document.createTextNode('；平均平方误差 '));waveOutput(p,result.loss,'data-ma-relay-loss','平均平方误差');
      p.appendChild(document.createTextNode('（已调整 '+relayLesson.cursor+' 次）'));
      if(result.gradient===null){paragraph('当前位置不执行更新。');return;}
      const calculation=paragraph('');calculation.className='ma-formula';const rowNode=document.createElement('span');rowNode.style.display='block';
      rowNode.appendChild(document.createTextNode('平均平方误差对偏置的局部影响 = (0 + 0 + 2 × '));waveOutput(rowNode,row.error,'data-ma-relay-error','第3秒有正负的偏差');
      rowNode.appendChild(document.createTextNode(' × 20) ÷ 3 = '));waveOutput(rowNode,result.gradient,'data-ma-relay-gradient','评分对偏置的导数');calculation.appendChild(rowNode);
      calculation.appendChild(document.createTextNode(status==='ready'?'下一次：当前偏置 − 0.00125 × 平均影响':'已停止；可以回退查看真实调整。'));
    }
    function updateRelayNav() {
      if(current().startsWith('relay-chain-')){updateChainNav();return;}
      if(current()==='relay-purpose'){next.textContent='先看变化怎样经过激活 →';return;}
      if(current()==='relay-shift') {
        next.disabled=!relayLesson.changed;next.textContent=relayLesson.changed?'让这次变化经过ReLU →':'先点公式里的−2.5';
        if(relayLesson.changed)back.textContent='← 撤回这次增加';return;
      }
      if(current()==='relay-gate'){next.textContent='把留下的变化带回预测 →';return;}
      if(current()==='relay-result'){next.textContent='偏置怎样影响评分？ →';return;}
      if(current()==='relay-ending'){next.textContent='重新探索偏置训练 ↻';return;}
      const status=relayStatus();if(relayLesson.cursor>0)back.textContent='← 回退一次调整';
      next.textContent=status==='ready'?'按当前影响调整一次':'这些影响怎样接起来？ →';
      automatic.hidden=status!=='ready'||relayLesson.cursor<1;automatic.textContent=autoRunning?'暂停':'继续调整';
    }
    function relayVertices(bias) {return [...new Set([0,-bias,2.5,3.5])].filter(t=>t>=0&&t<=3.5).sort((a,b)=>a-b);}
    function drawRelayBand(width,bias,gate,composition=false) {
      const X=t=>54+t/3.5*(width-76),Y=composition?v=>260-v/260*227:v=>260-(v+2.6)/3.8*227;
      const value=(t,b)=>{const r=bendCompute(t,1,gate,{...bendConfig,bias:b});return composition?r.prediction:r.branch;};
      const vertices=relayVertices(bias),lower=vertices.map(t=>[X(t),Y(value(t,-2.5))]),upper=vertices.map(t=>[X(t),Y(value(t,bias))]);
      el('path',{d:[...lower,...upper.reverse()].map(([x,y],i)=>(i?'L ':'M ')+x+' '+y).join(' ')+' Z',fill:accent,'fill-opacity':0.48,stroke:'none','data-ma-relay-change-band':'','data-ma-relay-band-composition':String(composition)});
    }
    function syncRelayValues(bias) {
      const result=relayEvaluate(bias),values={'data-ma-relay-bias':bias,'data-ma-relay-loss':result.loss,'data-ma-relay-error':result.rows[2].error,'data-ma-relay-gradient':result.gradient};
      Object.entries(values).forEach(([key,value])=>copy.querySelectorAll('['+key+']').forEach(node=>{node.textContent=value===null?'未定义':waveNumber(value);}));
      svg.setAttribute('data-ma-relay-current',String(bias));
    }
    function drawRelayFunction(width,bias,gate,activation) {
      drawBendFunction(width,1,bias,gate,activation,{min:-2.6,max:1.2,ticks:[-2,-1,0,1]});drawRelayBand(width,bias,gate);syncRelayValues(bias);
      svg.children[0].textContent+=' 深色窄带比较偏置负2.5与当前偏置的函数变化，不是另一次训练。';
    }
    function drawRelayPrediction(width,bias,compare) {
      drawBendComposition(width,1,{...bendConfig,bias});
      if(compare)drawRelayBand(width,bias,1,true);
      drawTrainingGap(width,relayEvaluate(bias).rows[2],'relay');syncRelayValues(bias);
    }
    function renderRelayGraph() {
      if(current().startsWith('relay-chain-')){renderChainGraph();return;}
      const width=Math.max(240,figure.getBoundingClientRect().width||736);
      if(current()==='relay-shift')animatePlot(current(),width,relayBias(),bias=>drawRelayFunction(width,bias,0,false),1000);
      if(current()==='relay-gate') {
        if(!relayLesson.gateSeen){relayLesson.gateSeen=true;lastPlot={scene:current(),width,distance:0};}
        animatePlot(current(),width,1,gate=>drawRelayFunction(width,relayBias(),gate,true),1100);
      }
      if(current()==='relay-result') {
        if(!relayLesson.resultSeen){relayLesson.resultSeen=true;lastPlot={scene:current(),width,distance:-2.5};}
        animatePlot(current(),width,relayBias(),bias=>drawRelayPrediction(width,bias,true),1100);
      }
      if(current()==='relay-train')animatePlot(current(),width,relayBias(),bias=>drawRelayPrediction(width,bias,false),800);
    }
    function advanceRelayTraining() {
      if(relayStatus()!=='ready')return;
      relayLesson.history=relayLesson.history.slice(0,relayLesson.cursor+1);relayLesson.history.push(relayStep(relayBias()));relayLesson.cursor++;
    }
    function scheduleRelayTraining() {
      autoTimer=setTimeout(()=>{
        autoTimer=null;if(!autoRunning||current()!=='relay-train')return;
        cancelPlotAnimation(true);advanceRelayTraining();if(relayStatus()!=='ready')autoRunning=false;
        refreshRelay();if(autoRunning)scheduleRelayTraining();
      },950);
    }
    function forwardRelay() {
      stopAutomation();
      if(current().startsWith('relay-chain-')){forwardChain();return;}
      if(current()==='relay-shift'&&!relayLesson.changed)return;
      if(current()==='relay-train'&&relayStatus()==='ready'){advanceRelayTraining();refreshRelay();return;}
      if(current()==='relay-ending'){relayLesson=null;state.scene=scenes.indexOf('relay-purpose');renderScene();return;}
      state.scene++;renderScene();
    }
    function backwardRelay() {
      stopAutomation();
      if(current().startsWith('relay-chain-')){backwardChain();return;}
      if(current()==='relay-shift'&&relayLesson.changed){relayLesson.changed=false;relayLesson.gateSeen=false;relayLesson.resultSeen=false;refreshRelay();return;}
      if(current()==='relay-train'&&relayLesson.cursor>0){relayLesson.cursor--;refreshRelay();return;}
      state.scene--;renderScene();
    }
    function renderScene() {
      stopAutomation();lastPlot=null;drag=null;feedback=null;
      if(current().startsWith('relay-'))ensureRelayLesson();
      if(current().startsWith('output-'))ensureOutputLesson();
      if(current().startsWith('bend-'))ensureBend();
      if(current().startsWith('wave-'))ensureWave();
      if(current().startsWith('bias-'))ensureBiasLesson();
      if(current().startsWith('step-'))ensureStepLesson();
      if(current().startsWith('learn-')) ensureLearning();
      if(current().startsWith('direction-')) ensureDirection();
      if(current()==='predict'||current()==='calculation') ensureSnapshot();
      root.className=textOnly()?'ma-text-page':'ma-interactive-page';
      figure.hidden=textOnly();handle.hidden=true;renderCopy();updateNav();renderStage();
    }
    function changeRule(value) {
      const distance=clamp(value,5,40);
      if(distance===state.distance) return;
      state.distance=distance;state.adjusted=true;state.snapshot=null;state.revealed=false;state.actualResult=null;state.highlight=null;
      // Preserve knowledge that the answer was revealed on an earlier visit.
      copy.children[0].textContent=`当前规则在第3秒预测出${number(predict(3))}厘米，而记录是110厘米。我们先调整规则，让它更接近已知答案。`;
      if(feedback) feedback.textContent=adjustmentFeedback();renderStage();
    }
    handle.addEventListener('pointerdown',event=>{
      if(current()==='bias-shift'){beginBiasDrag(event);return;}
      if(current()!=='adjust'||!geometry||event.button>0) return;
      drag={id:event.pointerId,clientX:event.clientX,distance:state.distance,scale:geometry.scale};
      handle.setPointerCapture(event.pointerId);event.preventDefault();
    });
    handle.addEventListener('pointermove',event=>{
      if(!drag||drag.id!==event.pointerId) return;
      if(drag.kind==='bias'){changeBiasOffset(drag.offset-(event.clientY-drag.clientY)/drag.scale);return;}
      changeRule(drag.distance+(event.clientX-drag.clientX)/(3*drag.scale));
    });
    function endDrag(event) {
      if(!drag||drag.id!==event.pointerId) return;
      if(handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);drag=null;
    }
    handle.addEventListener('pointerup',endDrag);handle.addEventListener('pointercancel',endDrag);
    handle.addEventListener('keydown',event=>{
      if(current()==='bias-shift') {
        const b=biasLesson.offset,values={ArrowUp:b+1,ArrowDown:b-1,PageUp:b+5,PageDown:b-5,Home:0,End:80};
        if(event.key in values){event.preventDefault();changeBiasOffset(values[event.key]);}return;
      }
      if(current()!=='adjust') return;
      const values={ArrowLeft:Math.ceil(state.distance)-1,ArrowRight:Math.floor(state.distance)+1,Home:5,End:40};
      if(!(event.key in values)) return;event.preventDefault();changeRule(values[event.key]);
    });
    back.addEventListener('click',()=>{
      if(current().startsWith('relay-')) {backwardRelay();return;}
      if(current().startsWith('output-')) {backwardOutput();return;}
      if(current().startsWith('bend-')) {backwardBend();return;}
      if(current().startsWith('wave-')) {backwardWave();return;}
      if(current().startsWith('bias-')) {backwardBias();return;}
      if(current().startsWith('step-')) {backwardStep();return;}
      if(current().startsWith('direction-')) {backwardDirection();return;}
      if(current().startsWith('learn-')) {backwardLearning();return;}
      if(state.scene>0){state.scene--;state.highlight=null;renderScene();}
    });
    next.addEventListener('click',()=>{
      if(current().startsWith('relay-')) {forwardRelay();return;}
      if(current().startsWith('output-')) {forwardOutput();return;}
      if(current().startsWith('bend-')) {forwardBend();return;}
      if(current().startsWith('wave-')) {forwardWave();return;}
      if(current().startsWith('bias-')) {forwardBias();return;}
      if(current().startsWith('step-')) {forwardStep();return;}
      if(current().startsWith('direction-')) {forwardDirection();return;}
      if(current().startsWith('learn-')) {forwardLearning();return;}
      if(current()==='predict'&&!state.revealed) {
        ensureSnapshot();state.actualResult=simulation.positionAt(4);state.revealed=true;state.seenResult=true;renderScene();return;
      }
      state.scene++;state.highlight=null;renderScene();
    });
    automatic.addEventListener('click',()=>{
      if(current()==='relay-train') {
        if(relayStatus()!=='ready'||relayLesson.cursor<1)return;
        if(autoRunning)stopAutomation();else{cancelPlotAnimation(true);autoRunning=true;scheduleRelayTraining();}
        updateNav();return;
      }
      if(current()==='output-train') {
        if(outputStatus()!=='ready'||outputLesson.cursor<1)return;
        if(autoRunning)stopAutomation();else{autoRunning=true;scheduleOutputTraining();}
        updateNav();return;
      }
      if(current()==='wave-train') {
        if(waveTrainStatus()!=='ready'||wave.cursor<2)return;
        if(autoRunning)stopAutomation();else{autoRunning=true;scheduleWaveTraining();}
        updateNav();return;
      }
      if(current()==='step-practice') {
        if(stepStatus()!=='ready'||stepLesson.inputError)return;
        if(autoRunning)stopAutomation();else {autoRunning=true;scheduleStepPractice();}
        updateNav();return;
      }
      if(current()!=='learn-loop'||loopEvent().phase==='done') return;
      if(autoRunning) stopAutomation();
      else {autoRunning=true;scheduleStep();}
      updateNav();
    });
    globalThis.addEventListener?.('pagehide',stopAutomation);
    globalThis.addEventListener?.('pageshow',()=>{stopAutomation();updateNav();});
    globalThis.addEventListener?.('hashchange',()=>{
      if(globalThis.location?.hash==='#act-2') {state.scene=7;renderScene();}
      if(globalThis.location?.hash==='#act-3') {state.scene=14;renderScene();}
      if(globalThis.location?.hash==='#act-4') {state.scene=scenes.indexOf('step-purpose');renderScene();}
      if(globalThis.location?.hash==='#act-5') {state.scene=scenes.indexOf('bias-observe');renderScene();}
      const chapter={'#act-6':'wave-multi-purpose','#act-7':'wave-score-purpose','#act-8':'wave-strips','#act-9':'wave-shape','#act-10':'bend-purpose','#act-11':'bend-gate','#act-12':'bend-neuron','#act-13':'output-purpose','#act-14':'relay-purpose','#act-14-chain':'relay-chain-trace'}[globalThis.location?.hash];
      if(chapter){state.scene=scenes.indexOf(chapter);renderScene();}
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden) {stopAutomation();updateNav();}
    });
    if(globalThis.location?.hash==='#act-2') state.scene=7;
    if(globalThis.location?.hash==='#act-3') state.scene=14;
    if(globalThis.location?.hash==='#act-4') state.scene=scenes.indexOf('step-purpose');
    if(globalThis.location?.hash==='#act-5') state.scene=scenes.indexOf('bias-observe');
    const waveChapter={'#act-6':'wave-multi-purpose','#act-7':'wave-score-purpose','#act-8':'wave-strips','#act-9':'wave-shape','#act-10':'bend-purpose','#act-11':'bend-gate','#act-12':'bend-neuron','#act-13':'output-purpose','#act-14':'relay-purpose','#act-14-chain':'relay-chain-trace'}[globalThis.location?.hash];
    if(waveChapter)state.scene=scenes.indexOf(waveChapter);
    renderScene();
    new ResizeObserver(()=>{
      cancelPlotAnimation(true);lastPlot=null;
      if(!textOnly())renderStage();
    }).observe(figure);
  })();
  </script>
</div>
