      if(current().startsWith('bend-')) {forwardBend();return;}
      if(current().startsWith('wave-')) {forwardWave();return;}
      if(current().startsWith('bias-')) {forwardBias();return;}
      if(current().startsWith('step-')) {forwardStep();return;}
      if(current().startsWith('direction-')) {forwardDirection();return;}
      if(current().startsWith('learn-')) {forwardLearning();return;}
      if(current()==='predict'&&!state.revealed) {
        ensureSnapshot();state.actualResult=simulation.positionAt(4);state.revealed=true;state.seenResult=true;renderScene();return;
      }
      state.scene++;state.highlight=null;renderScene();
    });
    automatic.addEventListener('click',()=>{
      if(current()==='whole-records'){stopAutomation();if(wholeLesson.sample<4){wholeLesson.sample++;wholeLesson.input=wholeRecords[wholeLesson.sample].input;refreshMesh();}return;}
      if(current()==='whole-train'){if(wholeStatus()!=='ready'||wholeLesson.detail)return;stopAutomation();wholeAdvance();wholeLesson.display=null;refreshMesh();return;}
      if(current()==='net-batch'){stopAutomation();netLesson.probe.active=false;lastPlot=null;if(netLesson.batch<4){netLesson.batch++;refreshNet();}return;}
      if(current()==='net-train'){if(netStatus()!=='ready')return;stopAutomation();advanceNetTraining();refreshNet();return;}
      if(current()==='onset-train'){if(onsetStatus()!=='ready')return;stopAutomation();advanceOnsetTraining();refreshOnset();return;}
      if(current()==='duo-train'){if(duoStatus()!=='ready')return;stopAutomation();advanceDuoTraining();refreshDuo();return;}
      if(current()==='joint-train') {
        if(jointStatus()!=='ready')return;
        stopAutomation();advanceJointTraining();refreshJoint();return;
      }
      if(current()==='relay-train') {
        if(relayStatus()!=='ready'||relayLesson.cursor<1)return;
        if(autoRunning)stopAutomation();else{cancelPlotAnimation(true);autoRunning=true;scheduleRelayTraining();}
        updateNav();return;
      }
      if(current()==='output-train') {
        if(outputStatus()!=='ready'||outputLesson.cursor<1)return;
        if(autoRunning)stopAutomation();else{autoRunning=true;scheduleOutputTraining();}
        updateNav();return;
      }
      if(current()==='wave-train') {
        if(waveTrainStatus()!=='ready'||wave.cursor<2)return;
        if(autoRunning)stopAutomation();else{autoRunning=true;scheduleWaveTraining();}
        updateNav();return;
      }
      if(current()==='step-practice') {
        if(stepStatus()!=='ready'||stepLesson.inputError)return;
        if(autoRunning)stopAutomation();else {autoRunning=true;scheduleStepPractice();}
        updateNav();return;
      }
      if(current()!=='learn-loop'||loopEvent().phase==='done') return;
      if(autoRunning) stopAutomation();
      else {autoRunning=true;scheduleStep();}
      updateNav();
    });
    globalThis.addEventListener?.('pagehide',stopAutomation);
    globalThis.addEventListener?.('pageshow',()=>{stopAutomation();if(wholeMode())refreshMesh();else updateNav();});
    globalThis.addEventListener?.('hashchange',()=>{
      if(globalThis.location?.hash==='#act-2') {state.scene=7;renderScene();}
      if(globalThis.location?.hash==='#act-3') {state.scene=14;renderScene();}
      if(globalThis.location?.hash==='#act-4') {state.scene=scenes.indexOf('step-purpose');renderScene();}
      if(globalThis.location?.hash==='#act-5') {state.scene=scenes.indexOf('bias-observe');renderScene();}

      if(chapter){state.scene=scenes.indexOf(chapter);renderScene();if(globalThis.location?.hash==='#act-21-node')meshOpenDetail('d');}
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden) {stopAutomation();if(wholeMode())refreshMesh();else updateNav();}
    });
    if(globalThis.location?.hash==='#act-2') state.scene=7;
    if(globalThis.location?.hash==='#act-3') state.scene=14;
    if(globalThis.location?.hash==='#act-4') state.scene=scenes.indexOf('step-purpose');
    if(globalThis.location?.hash==='#act-5') state.scene=scenes.indexOf('bias-observe');
    const waveChapter={'#act-6':'wave-multi-purpose','#act-7':'wave-score-purpose','#act-8':'wave-strips','#act-9':'wave-shape','#act-10':'bend-purpose','#act-11':'bend-gate','#act-12':'bend-neuron','#act-13':'output-purpose','#act-14':'relay-purpose','#act-14-chain':'relay-chain-trace','#act-15':'joint-purpose','#act-15-train':'joint-train','#act-16':'pair-observe','#act-16-add':'pair-add','#act-17':'duo-purpose','#act-17-train':'duo-train','#act-18':'onset-purpose','#act-18-train':'onset-train','#act-19':'net-purpose','#act-19-back':'net-backward','#act-19-batch':'net-batch','#act-19-train':'net-train','#act-20':'deep-summary','#act-20-layers':'deep-purpose','#act-20-compose':'deep-compose','#act-21':'mesh-purpose','#act-21-network':'mesh-input','#act-21-remove':'mesh-ablate','#act-21-node':'mesh-input','#act-22':'whole-purpose','#act-22-train':'whole-train','#act-22-paths':'whole-paths','#act-23':'text-purpose','#act-23-pairs':'text-pairs','#act-23-ids':'text-ids','#act-23-renumber':'text-renumber','#act-24':'usage-purpose','#act-24-usage':'usage-observe','#act-24-dimensions':'usage-dimensions','#act-24-data':'usage-data','#act-24-capacity':'usage-capacity','#act-27':'adapt-purpose','#act-27-probe':'adapt-probe','#act-27-rate':'adapt-rate','#act-27-update':'adapt-update','#act-26':'loss-observe','#act-26-design':'loss-design','#act-26-inverse':'loss-inverse','#act-26-ruler':'loss-ruler','#act-26-records':'loss-records','#act-26-curve':'loss-curve','#act-25':'prob-observe','#act-25-distribution':'prob-distribution','#act-25-convert':'prob-convert','#act-25-normalize':'prob-normalize','#act-24-shared':'usage-lookup','#act-24-lab':'emb-purpose','#act-24-lookup':'emb-lookup','#act-24-vector':'emb-vector','#act-24-compute':'emb-compute'}[globalThis.location?.hash];
    if(waveChapter)state.scene=scenes.indexOf(waveChapter);
    renderScene();
    if(globalThis.location?.hash==='#act-21-node'){
      if(document.readyState==='loading'||document.readyState==='interactive')globalThis.addEventListener?.('pageshow',()=>{if(globalThis.location?.hash==='#act-21-node'&&current()==='mesh-input')meshOpenDetail('d');},{once:true});
      else meshOpenDetail('d');
    }
    new ResizeObserver(entries=>{
      // Expanding the detail changes height, not its horizontal numeric scale.
      if(entries?.length&&meshView()?.detail&&plotMotion&&lastPlot?.width===Math.max(240,figure.getBoundingClientRect().width||736))return;
      cancelPlotAnimation(true);lastPlot=null;
      if(!textOnly())renderStage();
    }).observe(figure);
  })();
  </script>
