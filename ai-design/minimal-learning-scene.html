,'vocab-train','vocab-ending','flight','prefix-purpose','prefix-cut','prefix-read','prefix-ending','blend-purpose','blend-compose','blend-explore','blend-ending','weight-purpose','weight-equal','weight-mix','weight-ending','qk-purpose','qk-observe','qk-match','qk-ending','roles-purpose','roles-read','roles-match','roles-offer','roles-ending','derive-purpose','derive-q','derive-k','derive-shared','derive-link','derive-ending','rows-purpose','rows-build','rows-inspect','rows-ending','scores-purpose','scores-pair','scores-row','scores-all','scores-inspect','scores-ending','portions-exp','portions-cat','portions-white','portions-table','portions-ending','values-read','values-name','values-ending','project-fixed','project-adjust','project-shared','project-ending','residual-prepare','residual-join','residual-both','residual-ending','round-run','round-ending','place-content','place-position','place-verify','place-ending','mask-leak','mask-cut','mask-rows','mask-ending','readout-purpose','readout-score','readout-prob','readout-ending','tune-loss','tune-feedback','tune-train','tune-ending','backflow-fan','backflow-sum','backflow-residual','backflow-ending','vgrad-source','vgrad-return','vgrad-ending','agrad-source','agrad-feedback','agrad-trial','agrad-ending','sgrad-source','sgrad-response','sgrad-feedback','sgrad-ending','qgrad-source','qgrad-paths','qgrad-joint','qgrad-ending','kgrad-source','kgrad-feedback','kgrad-ending','wkshare-purpose','wkshare-rule','wkshare-feedback','wkshare-ending','wkgroup-goal','wkgroup-compose','wkgroup-train','wkgroup-ending','attlearn-goal','attlearn-value','attlearn-joint','attlearn-ending','multilearn-goal','multilearn-single','multilearn-batch','multilearn-ending','autogen-pick','autogen-feed','autogen-repeat','autogen-ending','sampler-pick','sampler-continue','sampler-retry','sampler-ending','thermo-goal','thermo-scores','thermo-sample','thermo-ending','unified-records','unified-joint','unified-train','endtoken-goal','endtoken-train','en     const predict=(seconds,distance=state.distance)=>rule.start+seconds*distance;
    const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));

    const aligned=(a,b)=>number(a)===number(b);
    function el(tag,attrs={},parent=svg) {

    }

    function drawReductionAverage(width,progress) {

      svg.setAttribute('data-ma-chart-kind','reduction-average');
      svg.setAttribute('data-ma-direction-parameter','22');
      svg.setAttribute('data-ma-average-progress',String(progress));
      svg.setAttribute('data-ma-total-reduction',String(total));
      svg.setAttribute('data-ma-mean-reduction',String(mean));

      title.textContent='参数由21增加到22时，三条差距分别减少'+rows.map(row=>number(row.reduction)).join('、')+'厘米；合计减少'+number(total)+'厘米，除以'+rows.length+'后，平均差距减少'+number(mean)+'厘米。当前参数仍是22。这是对减少量的拼合与均分，没有改变预测。';

          'data-ma-reduction-piece':row.seconds,'data-ma-origin-reduction':row.reduction,'data-ma-piece-value':portion});

    }
